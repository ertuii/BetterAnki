name: build
# Every push builds and tests. Pushing a tag v<version> (matching betteranki.__version__) also publishes a
# GitHub Release; the installed apps find it and update themselves.
on: [workflow_dispatch, push]
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest, zip: BetterAnki-macOS.zip }
          - { os: windows-latest, zip: BetterAnki-Windows.zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - if: startsWith(github.ref, 'refs/tags/v')
        run: uv run python -c "import betteranki, sys; sys.exit(0 if 'v' + betteranki.__version__ == '${{ github.ref_name }}' else 'Tag passt nicht zu __version__')"
      - run: uv run python tests/test_core.py
      - run: uv run python tests/test_phase2.py
      - run: uv run python tests/test_phase3.py
      - run: uv run python tests/test_phase4.py
      - run: uv run python tests/test_phase5.py
      - run: uv run python tests/test_updater.py
      - run: npm ci && npm run check
        working-directory: ui
      - run: uv run python build.py
      - if: runner.os == 'macOS'
        run: dist/BetterAnki.app/Contents/MacOS/BetterAnki --selfcheck "$RUNNER_TEMP/selfcheck.txt" || { cat "$RUNNER_TEMP/selfcheck.txt"; exit 1; }
      - if: runner.os == 'Windows'
        name: Smoke test, also as if unzipped with Windows' own tool (every file marked as downloaded)
        shell: pwsh
        run: |
          $app = (Resolve-Path dist/BetterAnki/BetterAnki.exe).Path
          $log = "$env:RUNNER_TEMP\selfcheck.txt"
          function Check($label) {
            Remove-Item $log -ErrorAction SilentlyContinue
            # direct start: the shell would refuse a marked exe here (for users: the "Run anyway" prompt)
            $si = [System.Diagnostics.ProcessStartInfo]::new($app, "--selfcheck `"$log`"")
            $si.UseShellExecute = $false
            $p = [System.Diagnostics.Process]::Start($si)
            $p.WaitForExit()
            Write-Host "$label -> exit $($p.ExitCode)"
            if (Test-Path $log) { Get-Content $log | Write-Host }
            return $p.ExitCode
          }
          $files = Get-ChildItem dist/BetterAnki -Recurse -File
          if ((Check "plain") -ne 0) { exit 1 }
          $files | ForEach-Object { Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" }
          if ((Check "marked") -ne 0) { exit 1 }
          # without the config the marked build has to fail, or this test proves nothing
          Rename-Item dist/BetterAnki/BetterAnki.exe.config cfg.bak
          $without = Check "marked, without BetterAnki.exe.config"
          Rename-Item dist/BetterAnki/cfg.bak BetterAnki.exe.config
          $files | ForEach-Object { Remove-Item -LiteralPath $_.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue }
          if ($without -eq 0) { Write-Host "::warning::Mark of the Web did not reproduce on this runner" }
      - if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/BetterAnki.app ${{ matrix.zip }}
      - if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/BetterAnki -DestinationPath ${{ matrix.zip }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: latest.json (what the apps check, see updater.py)
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          tag="${{ github.ref_name }}"
          echo "{\"version\": \"${tag#v}\", \"assets\": {\"BetterAnki-macOS.zip\": \"$base/BetterAnki-macOS.zip\", \"BetterAnki-Windows.zip\": \"$base/BetterAnki-Windows.zip\"}}" > latest.json
          python3 -m json.tool latest.json
      - run: gh release create "${{ github.ref_name }}" BetterAnki-macOS.zip BetterAnki-Windows.zip latest.json --repo "${{ github.repository }}" --generate-notes
        env: { GH_TOKEN: "${{ github.token }}" }
